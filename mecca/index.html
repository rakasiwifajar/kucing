<title>Kucing Mecca</title>
<style>
  :root{
    --wall:#f1ecfb; --floor:#d9cfe9; --ink:#4a3428;
    --food:#f29b5a; --water:#5ab4e8; --clean:#9b7be0; --fun:#f06b8f; --sleep:#4f6fd1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;height:-webkit-fill-available;overflow:hidden;background:var(--wall);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);touch-action:manipulation}
  #app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  /* room */
  #room{position:relative;flex:1;overflow:hidden;background:linear-gradient(var(--wall) 0 64%, var(--floor) 64% 100%)}
  #room::after{content:"";position:absolute;left:0;right:0;top:64%;height:6px;background:#bfb1d8}
  .window{position:absolute;top:24%;top:max(24%,150px);left:7%;width:22vw;height:24vw;max-width:150px;max-height:165px;background:#bfe6ff;border:8px solid #fff;border-radius:14px;box-shadow:0 3px 0 #e6d2bd;overflow:hidden;transition:background 1s}
  .window .sun{position:absolute;width:38%;padding-top:38%;height:0;border-radius:50%;background:#ffd34d;top:14%;left:18%;transition:all 1s}
  .window .cloud{position:absolute;width:55%;height:18%;background:#fff;border-radius:20px;bottom:22%;right:-8%}
  .frame{position:absolute;top:26%;top:max(26%,156px);right:8%;width:16vw;height:13vw;max-width:110px;max-height:92px;background:#fff;border:6px solid #c98f5c;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5vw,44px)}
  .rug{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(78%,520px);height:16%;border-radius:50%;background:#a8e6cf;box-shadow:inset 0 0 0 10px #84d6b6}
  #dark{position:absolute;top:0;left:0;right:0;bottom:0;background:#1d2350;opacity:0;pointer-events:none;transition:opacity 1.2s}
  body.night #dark{opacity:.55}
  body.night .window{background:#26306b}
  body.night .window .sun{background:#fff6c9;box-shadow:inset -10px -4px 0 #26306b}

  /* stars */
  #stars{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;border-radius:40px;padding:6px 18px;font-size:clamp(22px,5vw,34px);font-weight:800;box-shadow:0 4px 0 #ecd9c4;z-index:5;display:flex;gap:6px;align-items:center}
  #stars .s{display:inline-block;transition:transform .3s}
  #stars.pop .s{transform:scale(1.6) rotate(20deg)}
  #sound{position:absolute;top:10px;right:10px;z-index:6;width:56px;height:56px;border-radius:50%;border:none;background:#fff;font-size:28px;box-shadow:0 4px 0 #ecd9c4}

  /* meters */
  #meters{position:absolute;top:74px;left:50%;transform:translateX(-50%);display:flex;gap:clamp(6px,2vw,14px);z-index:5;background:#fff;padding:8px 14px;border-radius:22px;box-shadow:0 4px 0 #ecd9c4}
  .meter{width:clamp(46px,12vw,70px);display:flex;flex-direction:column;align-items:center;gap:4px}
  .meter .ic{font-size:clamp(20px,5vw,30px);line-height:1}
  .meter .bar{width:100%;height:14px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 2px #ecd9c4}
  .meter .fill{height:100%;border-radius:10px;transition:width .6s}
  .meter.low .ic{animation:wiggle .8s infinite}

  /* cat */
  #catWrap{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:62vw;height:62vw;max-width:46vh;max-height:46vh;width:min(62vw,46vh,360px);height:min(62vw,46vh,360px);z-index:3;cursor:pointer}
  #cat{width:100%;height:100%;overflow:visible;transform-origin:50% 90%;animation:breathe 3s ease-in-out infinite}
  #cat .tail{transform-origin:228px 230px;animation:tail 2.2s ease-in-out infinite}
  #cat .eyesOpen ellipse.pupil{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
  .happy #cat{animation:bounce .5s ease-in-out 3}
  body.night #cat{animation:breathe 4s ease-in-out infinite}
  #bubble{position:absolute;left:68%;top:-6%;width:30%;height:25%;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,7vw,50px);box-shadow:0 4px 0 #ecd9c4;opacity:0;transform:scale(.4);transition:all .4s;z-index:4}
  #bubble::after{content:"";position:absolute;left:8%;bottom:-6%;width:18%;height:22%;background:#fff;border-radius:50%}
  #bubble.show{opacity:1;transform:scale(1);animation:float 2s ease-in-out infinite}

  /* props */
  .prop{position:absolute;z-index:4;pointer-events:none;font-size:clamp(40px,11vw,80px);transition:opacity .4s, transform .4s}
  #fx{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:6;overflow:hidden}
  .fx{position:absolute;font-size:clamp(26px,7vw,46px);animation:rise 1.6s ease-out forwards}
  .bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#cdeeff 60%,#9fd8ff);opacity:.85;animation:bubbleUp 2s ease-out forwards}
  .zz{position:absolute;font-weight:900;color:#fff;font-size:clamp(26px,6vw,44px);animation:rise 2.4s ease-out forwards;text-shadow:0 2px 0 #4f6fd1}
  .confetti{position:absolute;width:12px;height:18px;border-radius:3px;animation:fall 2.2s linear forwards}

  /* buttons */
  #bar{display:grid;grid-template-columns:repeat(5,minmax(0,100px));justify-content:center;gap:clamp(8px,2.2vw,16px);padding:12px 10px calc(14px + env(safe-area-inset-bottom));background:#fff7ee;box-shadow:0 -4px 0 #ecd9c4}
  .btn{width:100%;height:clamp(60px,16vw,88px);border:none;border-radius:22px;font-size:clamp(26px,7.4vw,46px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .1s, box-shadow .1s, opacity .3s;cursor:pointer;padding:0}
  .btn small{font-size:clamp(11px,2.6vw,16px);font-weight:800;letter-spacing:.3px}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .btn[disabled]{opacity:.45}
  .btn.hint{animation:pulse 1s ease-in-out infinite}
  .b-pet{background:#c98f5c} .b-skin{background:#58c39a} .b-brush{background:#e8a33d} .b-dress{background:#e86fc4} .b-food{background:var(--food)} .b-water{background:var(--water)} .b-clean{background:var(--clean)} .b-fun{background:var(--fun)} .b-sleep{background:var(--sleep)}

  /* picker + mini game */

  #picker.show{display:flex}
  #picker .box{background:#fff;border-radius:30px;padding:22px;display:grid;grid-template-columns:repeat(3,auto);gap:clamp(10px,3vw,18px);box-shadow:0 8px 0 #ecd9c4;position:relative}
  #picker .box button:not(.x){width:clamp(80px,24vw,120px);height:clamp(80px,24vw,120px);border:none;border-radius:24px;font-size:clamp(44px,12vw,70px);color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center}
  #picker .box button:not(.x) small{font-size:clamp(12px,3vw,17px);font-weight:800}
  .x{position:absolute;top:-16px;right:-16px;width:48px;height:48px;border-radius:50%;border:none;background:#4a3428;color:#fff;font-size:24px;font-weight:900}
  #mini{position:absolute;top:0;left:0;right:0;bottom:0;z-index:12;display:none;background:linear-gradient(#bfe6ff,#e6f6ff);overflow:hidden}
  #mini.show{display:block}
  #mini .top{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;border-radius:40px;padding:6px 20px;font-size:clamp(24px,6vw,36px);font-weight:900;box-shadow:0 4px 0 #cfe3f2;z-index:2}
  #mini .time{position:absolute;top:70px;left:10%;right:10%;height:14px;background:#fff;border-radius:10px;overflow:hidden;z-index:2}
  #mini .time div{height:100%;background:#5ab4e8;width:100%;transition:width .2s linear}
  #mini .x{top:10px;right:10px}
  .gbub{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 12%,rgba(255,255,255,.4) 13%,rgba(180,225,255,.55) 60%,rgba(140,200,255,.8));border:3px solid rgba(255,255,255,.9);box-shadow:inset -6px -8px 14px rgba(120,170,255,.35);cursor:pointer}
  .gbub.pop{animation:popb .25s ease-out forwards}
  @keyframes popb{to{transform:scale(1.6);opacity:0}}
  @keyframes sweep{0%,100%{transform:translateX(-60%) rotate(-20deg)}50%{transform:translateX(160%) rotate(20deg)}}
  @keyframes roll{0%{transform:translateX(-120%) rotate(0)}100%{transform:translateX(420%) rotate(720deg)}}
  @keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
  .tilt #cat{animation:tilt .6s ease-in-out infinite}
  #learn{position:absolute;top:0;left:0;right:0;bottom:0;z-index:12;display:none;overflow:hidden;background:linear-gradient(#fff7d6,#ffeef5)}

  #learn .sw{display:inline-block;width:clamp(30px,8vw,44px);height:clamp(30px,8vw,44px);border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #ddd}
  #learn .head svg{width:clamp(34px,9vw,48px);height:clamp(34px,9vw,48px)}
  .tb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset -8px -10px 16px rgba(0,0,0,.12), inset 6px 8px 12px rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.9)}
  .tb.shape{background:radial-gradient(circle at 30% 30%,#fff,rgba(220,240,255,.9))}
  .tb svg{width:62%;height:62%}

  .tb.pop{animation:popb .25s ease-out forwards}

  .bigN{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:clamp(70px,22vw,140px);font-weight:900;color:#f06b8f;text-shadow:0 6px 0 #fff;opacity:0;transition:opacity .3s}
  .bigN.show{opacity:1;animation:pulse .6s 2}
  .zoo{position:absolute;top:80px;left:0;right:0;bottom:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 14px;align-content:center}
  .zoo button{border:none;background:#fff;border-radius:24px;box-shadow:0 6px 0 #ecd9c4;font-size:clamp(46px,13vw,80px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;height:clamp(96px,24vw,150px)}
  .zoo button small{font-size:clamp(13px,3.4vw,18px);font-weight:800;color:var(--ink)}
  .zoo button.go{animation:bounce .5s 2}
  #picker .box{grid-template-columns:repeat(4,auto)}
  @media (max-width:520px){ #picker .box{grid-template-columns:repeat(3,auto);padding:16px} #picker .box button:not(.x){width:clamp(72px,23vw,100px);height:clamp(72px,23vw,100px);font-size:clamp(36px,10vw,54px)} }
  .keys{position:absolute;left:10px;right:10px;bottom:12px;top:120px;display:flex;gap:6px}
  .keys button{flex:1;border:none;border-radius:18px;color:#fff;font-weight:900;font-size:clamp(14px,4vw,22px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .08s}
  .keys button.on{transform:translateY(6px) scale(.97);filter:brightness(1.2);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .playsong{position:absolute;top:66px;left:50%;transform:translateX(-50%);border:none;background:#fff;border-radius:30px;padding:6px 18px;font-size:clamp(16px,4.4vw,22px);font-weight:900;box-shadow:0 4px 0 #ecd9c4;z-index:3}
  .note{position:absolute;font-size:34px;animation:rise 1.2s ease-out forwards;pointer-events:none}
  #pad{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;background:#fff}
  .pal{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 8px;z-index:3}
  .pal button{width:clamp(42px,11vw,58px);height:clamp(42px,11vw,58px);border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2);font-size:clamp(20px,6vw,30px);background:#fff;padding:0}
  .pal button.sel{transform:scale(1.18);box-shadow:0 0 0 4px #4a3428}
  .sil{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(110px,32vw,200px);line-height:1;filter:brightness(0) opacity(.85);transition:filter .5s}
  .sil.show{filter:none;animation:bounce .5s 2}
  .opts{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;gap:clamp(10px,4vw,24px)}
  .opts button{width:clamp(88px,26vw,130px);height:clamp(88px,26vw,130px);border:none;border-radius:26px;background:#fff;box-shadow:0 7px 0 #ecd9c4;font-size:clamp(50px,14vw,78px)}
  .opts button.nope{animation:wiggle .4s 2}
  .bush{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .bush .cover{font-size:clamp(70px,20vw,120px);transition:transform .4s, opacity .4s;position:relative;z-index:2}
  .bush .under{position:absolute;font-size:clamp(50px,14vw,84px);z-index:1}
  .bush.open .cover{transform:translateY(-55%) rotate(-12deg);opacity:.35}
  #choose{position:absolute;top:0;left:0;right:0;bottom:0;z-index:16;background:rgba(74,52,40,.35);display:none;align-items:center;justify-content:center}
  #choose.show{display:flex}
  #choose .box{background:#fff;border-radius:30px;padding:20px;display:grid;grid-template-columns:repeat(3,auto);gap:clamp(10px,3vw,16px);box-shadow:0 8px 0 #ecd9c4;position:relative}
  #choose .ttl{grid-column:1/-1;text-align:center;font-size:clamp(20px,5.5vw,30px);font-weight:900}
  #choose .box button:not(.x){width:clamp(80px,24vw,112px);height:clamp(80px,24vw,112px);border:none;border-radius:24px;font-size:clamp(40px,11vw,62px);background:#fff7ee;box-shadow:0 6px 0 #ecd9c4;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #choose .box button:not(.x) small{font-size:clamp(12px,3.2vw,16px);font-weight:800;color:var(--ink)}
  .hand{position:absolute;font-size:clamp(46px,12vw,70px);z-index:7;pointer-events:none;animation:petHand 1.1s ease-in-out 3}
  @keyframes petHand{0%,100%{transform:translate(0,0) rotate(-10deg)}50%{transform:translate(70px,26px) rotate(12deg)}}
  .petting #cat{animation:breathe 1s ease-in-out infinite}
  .b-meal{background:#ef8354}
  body.meal #catWrap{bottom:34%;width:min(46vw,34vh,280px);height:min(46vw,34vh,280px)}
  body.meal #bubble{display:none}
  #meal{position:absolute;top:0;left:0;right:0;bottom:0;z-index:14;display:none}
  #meal.show{display:block}
  #meal .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:34px 34px 0 0;box-shadow:0 -6px 0 #ecd9c4;padding:14px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
  #meal .mt{font-size:clamp(18px,5vw,26px);font-weight:900;text-align:center}
  #meal .row{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,26px);width:100%}

  .plate .pc{position:absolute;font-size:clamp(20px,5.5vw,28px);transition:transform .4s, opacity .4s}

  .plate .cnt2{position:absolute;inset:0;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,36px);font-weight:900;color:#ef8354}
  .aam{border:none;background:#ef8354;color:#fff;border-radius:30px;font-size:clamp(30px,8vw,46px);font-weight:900;padding:14px 22px;box-shadow:0 8px 0 #c4623a;display:flex;flex-direction:column;align-items:center;line-height:1.05;min-width:clamp(140px,40vw,200px)}

<script>
(function(){
  const NEEDS = [
    {k:'food',  ic:'🐟', col:'var(--food)'},
    {k:'water', ic:'💧', col:'var(--water)'},
    {k:'clean', ic:'🛁', col:'var(--clean)'},
    {k:'fun',   ic:'⚽', col:'var(--fun)'},
    {k:'sleep', ic:'🌙', col:'var(--sleep)'}
  ];
  const state = {food:70, water:70, clean:80, fun:60, sleep:80, stars:0, acc:0};
  try{ const s = JSON.parse(localStorage.getItem('kucingMecca')||'null'); if(s) Object.assign(state, s); }catch(e){}
  const save = () => { try{ localStorage.setItem('kucingMecca', JSON.stringify(state)); }catch(e){} };

  const $ = s => document.querySelector(s);
  const meters = $('#meters'), fx = $('#fx'), wrap = $('#catWrap'), bubble = $('#bubble');
  const eyesOpen = $('#cat .eyesOpen'), eyesClosed = $('#cat .eyesClosed'), mouth = $('#mouth'), mouthOpen = $('#mouthOpen');

  NEEDS.forEach(n=>{
    const d=document.createElement('div'); d.className='meter'; d.id='m-'+n.k;
    d.innerHTML=`<div class="ic">${n.ic}</div><div class="bar"><div class="fill" style="background:${n.col}"></div></div>`;
    meters.appendChild(d);
  });

  /* ---------- sound ---------- */
  let ac=null, soundOn=true;
  function ctx(){
    try{
      if(!ac){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) ac=new AC(); }
      if(ac && ac.state!=='running' && ac.resume){ const r=ac.resume(); if(r&&r.catch) r.catch(()=>{}); }
      if(ac && !ac._unlocked){ const b=ac.createBuffer(1,1,22050), src=ac.createBufferSource(); src.buffer=b; src.connect(ac.destination); (src.start?src.start(0):src.noteOn(0)); ac._unlocked=true; }
    }catch(e){}
    return ac;
  }
  ['touchstart','touchend','pointerdown','click'].forEach(ev=>document.addEventListener(ev,()=>ctx(),{passive:true}));
  function tone(f1,f2,dur,type='sine',vol=.25,delay=0){
    if(!soundOn) return; const a=ctx(); if(!a) return;
    try{
      const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
      o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(f2,30),t+dur);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
    }catch(e){}
  }
  /* ---- synthesized animal voices (formant + noise based) ---- */
  let noiseBuf=null;
  function noise(a){ if(noiseBuf) return noiseBuf; const n=a.sampleRate*2, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; noiseBuf=b; return b; }
  function voice(o){ /* o: {f:[[t,freq]...], dur, type, formants:[[freq,q,gain]], vol, vib, trem, noise, attack} */
    if(!soundOn) return; const a=ctx(); if(!a) return;
    try{
      const t0=a.currentTime+(o.delay||0), d=o.dur;
      const out=a.createGain(); out.gain.setValueAtTime(0.0001,t0); out.gain.exponentialRampToValueAtTime(o.vol||.35,t0+(o.attack||.04));
      out.gain.setValueAtTime(o.vol||.35,t0+d*.75); out.gain.exponentialRampToValueAtTime(0.0001,t0+d); out.connect(a.destination);
      const mix=a.createGain(); mix.gain.value=1;
      if(o.trem){ const lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=o.trem; lg.gain.value=.45; lfo.connect(lg); lg.connect(mix.gain); lfo.start(t0); lfo.stop(t0+d+.1); }
      (o.formants||[[0,0,1]]).forEach(([ff,q,g])=>{ let node=mix; if(ff){ const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=ff; bp.Q.value=q; const gg=a.createGain(); gg.gain.value=g; mix.connect(bp); bp.connect(gg); gg.connect(out); } else { const gg=a.createGain(); gg.gain.value=g; mix.connect(gg); gg.connect(out);} });
      if(o.f){ const osc=a.createOscillator(); osc.type=o.type||'sawtooth'; osc.frequency.setValueAtTime(o.f[0][1],t0); o.f.slice(1).forEach(([tt,ff])=>osc.frequency.linearRampToValueAtTime(ff,t0+tt*d));
        if(o.vib){ const v=a.createOscillator(), vg=a.createGain(); v.frequency.value=o.vib[0]; vg.gain.value=o.vib[1]; v.connect(vg); vg.connect(osc.frequency); v.start(t0); v.stop(t0+d+.1); }
        osc.connect(mix); osc.start(t0); osc.stop(t0+d+.05); }
      if(o.noise){ const ns=a.createBufferSource(); ns.buffer=noise(a); const ng=a.createGain(); ng.gain.value=o.noise; ns.connect(ng); ng.connect(mix); ns.start(t0); ns.stop(t0+d+.05); }
    }catch(e){}
  }
  const ANIMAL = {
    sapi(){ voice({f:[[0,95],[.15,118],[.7,110],[1,88]],dur:1.5,type:'sawtooth',formants:[[350,4,2.2],[800,6,.9],[0,0,.15]],vol:.45,attack:.25,vib:[5,2]}); },
    ayam(){ const seg=[[[[0,520],[1,620]],.18],[[[0,620],[1,640]],.18],[[[0,640],[.4,820],[1,700]],.45],[[[0,820],[.3,900],[1,520]],.7]]; let t=0;
      seg.forEach(([f,d])=>{ voice({f,dur:d,delay:t,type:'sawtooth',formants:[[1400,5,2],[2600,8,.8]],vol:.32,attack:.02,vib:[28,18]}); t+=d+.02; }); },
    kambing(){ voice({f:[[0,520],[.2,560],[1,480]],dur:1.0,type:'sawtooth',formants:[[900,5,2],[2200,7,.8]],vol:.32,trem:11,attack:.05}); },
    domba(){ voice({f:[[0,330],[.3,360],[1,300]],dur:1.1,type:'sawtooth',formants:[[650,4,2],[1800,6,.7]],vol:.34,trem:8,attack:.06}); },
    bebek(){ for(let i=0;i<3;i++) voice({f:[[0,560],[1,430]],dur:.17,delay:i*.26,type:'square',formants:[[1100,6,2.4],[2400,8,.6]],vol:.28,noise:.15,attack:.01}); },
    anjing(){ [0,.32].forEach(dl=>voice({f:[[0,420],[.3,560],[1,240]],dur:.2,delay:dl,type:'sawtooth',formants:[[700,3,2],[1600,5,1]],noise:.35,vol:.5,attack:.005})); },
    kucing(){ voice({f:[[0,480],[.35,760],[1,420]],dur:.85,type:'sawtooth',formants:[[700,5,1.6],[1600,6,1.2],[3000,8,.4]],vol:.33,attack:.08,vib:[6,8]}); },
    katak(){ [0,.42].forEach(dl=>voice({f:[[0,140],[1,110]],dur:.3,delay:dl,type:'square',formants:[[500,6,2],[1200,8,.5]],vol:.35,trem:32,attack:.01})); },
    gajah(){ voice({f:[[0,380],[.3,760],[.8,700],[1,520]],dur:1.2,type:'sawtooth',formants:[[1200,9,2.5],[2500,10,1]],noise:.12,vol:.38,attack:.05,vib:[7,25]}); }
  };
  const sfx = {
    meow(){ ANIMAL.kucing(); },
    nom(){ for(let i=0;i<4;i++) tone(260,180,.09,'square',.08,i*.22); },
    drink(){ for(let i=0;i<5;i++) tone(700,1200,.08,'sine',.15,i*.18); },
    splash(){ for(let i=0;i<7;i++) tone(400+Math.random()*900,1600,.12,'sine',.1,i*.12); },
    boing(){ tone(200,700,.25,'sine',.25); tone(220,760,.25,'sine',.2,.5); tone(240,820,.25,'sine',.2,1); },
    sleep(){ [523,440,392,330].forEach((f,i)=>tone(f,f*.99,.5,'sine',.15,i*.45)); },
    purr(){ for(let i=0;i<6;i++) tone(60,50,.12,'sawtooth',.06,i*.14); },
    star(){ [784,988,1319].forEach((f,i)=>tone(f,f,.14,'triangle',.18,i*.09)); },
    click(){ tone(660,990,.07,'triangle',.18); },
    pop(){ tone(900+Math.random()*500,300,.08,'sine',.25); },
    brush(){ for(let i=0;i<6;i++) tone(2400,1800,.06,'triangle',.05,i*.2); },
    sparkle(){ [1319,1568,1760,2093].forEach((f,i)=>tone(f,f,.12,'sine',.12,i*.1)); },
    yay(){ [523,659,784,1047].forEach((f,i)=>tone(f,f,.18,'triangle',.2,i*.12)); }
  };
  let idVoice=null;
  function pickVoice(){ try{ const v=speechSynthesis.getVoices(); idVoice=v.find(x=>/^id|^in/i.test(x.lang))||null; }catch(e){} }
  if('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
  function say(text,after){
    let fired=false; const go=()=>{ if(!fired){ fired=true; if(after) after(); } };
    if(!soundOn || !('speechSynthesis' in window)){ if(after) setTimeout(go,300); return; }
    try{ const u=new SpeechSynthesisUtterance(text); u.lang='id-ID'; if(idVoice) u.voice=idVoice; u.rate=.92; u.pitch=1.45;
      u.onend=go; u.onerror=go; if(after) setTimeout(go, 600+text.length*85);
      if(speechSynthesis.speaking) speechSynthesis.cancel(); setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){ go(); } },30);
    }catch(e){ go(); }
  }
  $('#sound').addEventListener('click',()=>{ soundOn=!soundOn; $('#sound').textContent=soundOn?'🔊':'🔇'; if(soundOn) sfx.meow(); });

  const ACC=[null,['🎀',96,58,64],['👑',150,30,70],['🕶️',150,116,74],['🎩',150,20,78],['🌸',212,62,56],['🧢',150,34,82]];
  const ACCNAME=['','pita','mahkota','kacamata hitam','topi pesulap','bunga','topi'];
  const accG=document.getElementById('acc');
  function drawAcc(){
    accG.innerHTML=''; const a=ACC[state.acc%ACC.length]; if(!a) return;
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',a[1]); t.setAttribute('y',a[2]); t.setAttribute('font-size',a[3]); t.setAttribute('dominant-baseline','middle'); t.textContent=a[0];
    accG.appendChild(t);
  }
  drawAcc();
  /* ---------- render ---------- */
  function render(){
    let lowest=null;
    NEEDS.forEach(n=>{
      const v=Math.max(0,Math.min(100,state[n.k]));
      const el=$('#m-'+n.k); el.querySelector('.fill').style.width=v+'%';
      el.classList.toggle('low', v<30);

    const COLS=['#ef4444','#f97316','#facc15','#22c55e','#3b82f6','#a855f7','#4a3428'];

    const pal=document.createElement('div'); pal.className='pal'; larea.appendChild(pal);
    function sel(b){ pal.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }
    COLS.forEach((c,i)=>{ const b=document.createElement('button'); b.style.background=c; pal.appendChild(b); if(i===0) b.classList.add('sel');
      b.addEventListener('click',()=>{ col=c; mode='pen'; sel(b); sfx.click(); }); });

    function pos(e){ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return [p.clientX-r.left,p.clientY-r.top]; }
    function down(e){ e.preventDefault(); const [x,y]=pos(e);

      last=[x,y]; g.fillStyle=col; g.beginPath(); g.arc(x,y,9,0,7); g.fill(); }
    function move(e){ if(!last) return; e.preventDefault(); const [x,y]=pos(e); g.strokeStyle=col; g.lineWidth=18; g.beginPath(); g.moveTo(last[0],last[1]); g.lineTo(x,y); g.stroke(); last=[x,y]; }
    function up(){ if(last){ strokes++; check(); } last=null; }
    function check(){ if(strokes%12===0 && L.earned<3){ L.earned++; sfx.star(); say(rnd(['Bagus sekali!','Wah, cantik!','Hebat!'])); } }
    if(window.PointerEvent){ cv.addEventListener('pointerdown',down); cv.addEventListener('pointermove',move); window.addEventListener('pointerup',up); }

    L.earned=1;
  }

            else { tone(260,200,.15,'triangle',.1); say(rnd(['Coba lagi','Hampir!','Bukan di situ'])); }
          } };
        if(window.PointerEvent){ pc.addEventListener('pointerdown',e=>{ try{pc.setPointerCapture(e.pointerId);}catch(_){} down(e); }); pc.addEventListener('pointermove',move); pc.addEventListener('pointerup',up); pc.addEventListener('pointercancel',up); }
        else { pc.addEventListener('touchstart',down,{passive:false}); pc.addEventListener('touchmove',move,{passive:false}); pc.addEventListener('touchend',up); }
      });
    }
    round();
  }

  /* Mancing */
  function fishSVG(c){ return `<svg viewBox="0 0 120 70"><path d="M86 35 L118 10 L111 35 L118 60 Z" fill="${c}"/><ellipse cx="50" cy="35" rx="42" ry="25" fill="${c}"/><path d="M40 14 q14 -12 30 0" fill="${c}"/><ellipse cx="54" cy="40" rx="22" ry="11" fill="#fff" opacity=".25"/><circle cx="26" cy="30" r="7" fill="#fff"/><circle cx="24" cy="30" r="3.5" fill="#222"/><path d="M12 40 q5 4 10 0" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`; }
  function startFishing(){
    openLearn(); const TARGET=10; let got=0, busyHook=false;
    lhead.textContent='Mancing Ikan 🎣';
    larea.innerHTML=`<div class="pond-sky"></div><div class="pond-water"></div><div class="dock"></div><div class="fcat">🐱</div>
      <div class="bucket">🪣<span id="fcount">0/${TARGET}</span></div>
      <svg id="rodline"><line id="rod" stroke="#7a4520" stroke-width="6" stroke-linecap="round"/><line id="line" stroke="#fff" stroke-width="2"/><path id="hook" d="" stroke="#555" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
    say('Ayo mancing! Ketuk ikannya, nanti Kucing Mecca tangkap.');
    const W=learn.clientWidth, H=learn.clientHeight, waterTop=H*.26;
    const cat=larea.querySelector('.fcat').getBoundingClientRect(), R=learn.getBoundingClientRect();
    const base=[cat.left-R.left+cat.width*.75, cat.top-R.top+cat.height*.55], tip=[Math.min(W*.48, base[0]+150), waterTop-90];
    const rod=document.getElementById('rod'), line=document.getElementById('line'), hook=document.getElementById('hook');
    rod.setAttribute('x1',base[0]); rod.setAttribute('y1',base[1]); rod.setAttribute('x2',tip[0]); rod.setAttribute('y2',tip[1]);
    let hx=tip[0], hy=waterTop+20;
    function drawHook(){ line.setAttribute('x1',tip[0]); line.setAttribute('y1',tip[1]); line.setAttribute('x2',hx); line.setAttribute('y2',hy);
      hook.setAttribute('d',`M${hx} ${hy} v10 q0 10 -9 10 q-7 0 -7 -7`); }
    drawHook();
    const fishes=[];
    function addFish(){
      const c=rnd(COLORS); const f=document.createElement('div'); f.className='fish'; f.innerHTML=fishSVG(c.c); larea.appendChild(f);
      const fw=f.clientWidth||90, fh=f.clientHeight||55;
      const o={el:f,c,x:Math.random()*(W-fw),y:waterTop+30+Math.random()*(H-waterTop-fh-50),v:(.6+Math.random()*1.1)*(Math.random()<.5?-1:1),fw,fh,hooked:false,ph:Math.random()*6};
      fishes.push(o);
      onTap(f,()=>catchFish(o));
    }
    for(let i=0;i<5;i++) addFish();
    function loop(t){ if(!L.alive) return;
      fishes.forEach(o=>{ if(o.hooked) return; o.x+=o.v; if(o.x<-10||o.x>W-o.fw+10){ o.v*=-1; }
        const yy=o.y+Math.sin(t/600+o.ph)*6; o.el.style.left=o.x+'px'; o.el.style.top=yy+'px'; o.el.style.transform=o.v>0?'scaleX(-1)':'none'; o.cy=yy; });
      requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
    function tween(x0,y0,x1,y1,ms,step,done){ const st=performance.now(); (function f(t){ if(!L.alive) return; const k=Math.min(1,(t-st)/ms), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      step(x0+(x1-x0)*e,y0+(y1-y0)*e); if(k<1) requestAnimationFrame(f); else done&&done(); })(st); }
    function catchFish(o){
      if(busyHook||o.hooked) return; busyHook=true; o.hooked=true; ctx();
      const fx2=o.x+(o.v>0?o.fw*.85:o.fw*.15), fy2=o.cy+o.fh*.45;
      tone(700,300,.25,'sine',.15);
      tween(hx,hy,fx2,fy2-20,450,(x,y)=>{hx=x;hy=y;drawHook();},()=>{
        o.el.classList.add('hooked'); sfx.splash();
        const sx=o.x, sy=o.cy;
        tween(hx,hy,tip[0],tip[1]+40,800,(x,y)=>{ hx=x;hy=y;drawHook(); o.el.style.left=(sx+(x-fx2))+'px'; o.el.style.top=(sy+(y-fy2+20))+'px'; },()=>{
          got++; document.getElementById('fcount').textContent=`${got}/${TARGET}`;
          const bk=larea.querySelector('.bucket').getBoundingClientRect();
          o.el.style.transition='left .5s, top .5s, transform .5s, opacity .5s';
          o.el.style.left=(bk.left-R.left)+'px'; o.el.style.top=(bk.top-R.top)+'px'; o.el.style.transform='scale(.3)'; o.el.style.opacity='0';
          sfx.pop(); tone(880,1320,.15,'triangle',.18,.1);
          say(`Dapat ikan ${o.c.k}! ${got<=10?NUM[got]:got}`);
          setTimeout(()=>{ o.el.remove(); fishes.splice(fishes.indexOf(o),1); if(got<TARGET) addFish(); },550);
          hx=tip[0]; hy=waterTop+20; drawHook(); busyHook=false;
          if(got%3===0) L.earned++;
          if(got>=TARGET){ busyHook=true; later(()=>finishLearn('Hore! Dapat sepuluh ikan! Kucing Mecca senang sekali!'),1400); }
        });
      });
    }
    // tapping the water makes a ripple
    larea.querySelector('.pond-water').addEventListener('click',e=>{ const rp=document.createElement('div'); rp.className='ripple';
      rp.style.left=(e.clientX-R.left-10)+'px'; rp.style.top=(e.clientY-R.top-10)+'px'; larea.appendChild(rp); setTimeout(()=>rp.remove(),800); tone(500,250,.12,'sine',.08); });
  }

  /* Hewan */
  function startAnimals(){
    openLearn();
    const Z=[['🐄','sapi','Mooo'],['🐔','ayam','Kukuruyuk'],['🐐','kambing','Mbeeek'],['🦆','bebek','Kwek kwek'],['🐶','anjing','Guk guk'],['🐱','kucing','Meong'],['🐸','katak','Kwok kwok'],['🐘','gajah','Ngooong'],['🐑','domba','Mbeee']];
    lhead.textContent='Suara Hewan 🎵'; say('Ketuk hewannya, dengar suaranya!');
    const z=document.createElement('div'); z.className='zoo'; larea.appendChild(z);
    const seen=new Set();
    Z.forEach(([e,k,snd])=>{
      const b=document.createElement('button'); b.innerHTML=`${e}<small>${k}</small>`; z.appendChild(b);
      b.addEventListener('click',()=>{
        b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); sfx.click();
        say('Ini '+k, ()=>{ if(ANIMAL[k]) ANIMAL[k](); });
        if(!seen.has(k)){ seen.add(k); if(seen.size%3===0){ L.earned++; sfx.star(); } if(seen.size===Z.length) later(()=>finishLearn('Hebat! Sudah kenal semua hewan!'),1800); }
      });
    });
  }


  /* stroking: drag finger over the cat */
  let stroking=false, dist=0, lastP=null, petOn=null;
  function showPetHint(){
    say('Ayo elus Kucing Mecca. Usap-usap pakai jari!');
    const r=rect(), R=roomRect(); const h=document.createElement('div'); h.className='hand'; h.textContent='🤚';
    h.style.left=(r.left-R.left + r.width*.28)+'px'; h.style.top=(r.top-R.top + r.height*.18)+'px'; fx.appendChild(h);
    setTimeout(()=>h.remove(),3400);
  }
  function petStart(e){ if(busy) return; stroking=true; dist=0; lastP=[e.clientX,e.clientY]; ctx(); }
  function petMove(e){
    if(!stroking||busy) return;
    const d=Math.hypot(e.clientX-lastP[0], e.clientY-lastP[1]); lastP=[e.clientX,e.clientY]; dist+=d;
    if(dist>55){ dist=0; wrap.classList.add('petting'); eyes(true); sfx.purr();
      const R=roomRect(); const h=document.createElement('div'); h.className='fx'; h.textContent=rnd(['💖','💕','✨']);
      h.style.left=(e.clientX-R.left-16)+'px'; h.style.top=(e.clientY-R.top-30)+'px'; fx.appendChild(h); setTimeout(()=>h.remove(),1700);
      state.fun=Math.min(100,state.fun+2); clearTimeout(petOn);
      petOn=setTimeout(()=>{ wrap.classList.remove('petting'); eyes(false); },700);
      if(!wrap._petCount) wrap._petCount=0; wrap._petCount++;
      if(wrap._petCount%12===0){ say(rnd(['Kucing Mecca senang dielus!','Enaknya dielus!','Meong, terima kasih!'])); addStar(); save(); render(); }
    }
  }
  function petEnd(){ if(stroking && wrap.classList.contains('petting')) setTimeout(()=>sfx.meow(),300); stroking=false; }
  if(window.PointerEvent){ wrap.addEventListener('pointerdown',petStart); wrap.addEventListener('pointermove',petMove); window.addEventListener('pointerup',petEnd); window.addEventListener('pointercancel',petEnd); }
  else { wrap.addEventListener('touchstart',e=>petStart(e.touches[0]),{passive:true}); wrap.addEventListener('touchmove',e=>{ e.preventDefault(); petMove(e.touches[0]); },{passive:false}); wrap.addEventListener('touchend',petEnd); }
  wrap.style.touchAction='none';

  /* petting */
  let lastPet=0;
  wrap.addEventListener('click',()=>{
    if(busy) return; ctx(); const now=Date.now(); if(now-lastPet<700) return; lastPet=now;
    eyes(true); sfx.purr(); emitAt('💖',4); state.fun=Math.min(100,state.fun+6);
    setTimeout(()=>{ eyes(false); sfx.meow(); },900);
    if(Math.random()<.5) say(Math.random()<.5?'Meong!':'Kucing Mecca senang dielus!');
    render(); save();
  });

  /* slow, gentle decay: never reaches zero */
  setInterval(()=>{
    if(busy || document.hidden || $('#start').style.display!=='none') return;
    state.food=Math.max(8,state.food-2); state.water=Math.max(8,state.water-2.5);
    state.clean=Math.max(8,state.clean-1.2); state.fun=Math.max(8,state.fun-2);
    state.sleep=Math.max(8,state.sleep-1.5);
    render(); save();
  },5000);

  $('#go').addEventListener('click',()=>{
    ctx(); $('#start').style.display='none'; sfx.meow(); say('Halo! Aku Kucing Mecca'); render();
    try{ const el=document.documentElement; const f=el.requestFullscreen||el.webkitRequestFullscreen; if(f){ const r=f.call(el); if(r&&r.catch) r.catch(()=>{}); } }catch(e){}
  });

  try{ if(state.meals) document.getElementById('mealsBadge').textContent='🍽️ Piring bersih: '+state.meals+' kali'; }catch(e){}
  render();
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
